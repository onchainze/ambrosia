<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ambrosia">
<title>Ambrosia</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400&family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* Cores */
  --bg:#ffffff; --ink:#2a2a2a; --line:#111111; --muted:#5c5c5c;
  --btn:#111111; --btn-ink:#ffffff; --soft:#f3f3f3; --alert:#a3261b;
  /* Tipos de letra */
  --f-title:"Inter Tight","Arial Narrow",Arial,sans-serif;
  --f-body:"Hanken Grotesk",Arimo,Arial,sans-serif;
  /* Tamanhos (telemóvel, cerca de 35% abaixo do desktop, com mínimos legíveis) */
  --fs-logo:22px; --fs-h1:28px; --fs-h2:26px; --fs-intro:18px; --fs-body:16px;
  --fs-h3:17px; --fs-tick:13px; --fs-btn:14px; --fs-small:13px;
  /* Espaçamentos */
  --m:14px; --gap:14px; --sp1:8px; --sp2:16px; --sp3:28px; --sp4:48px; --hdh:56px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:900px){
  :root{--fs-logo:40px;--fs-h1:44px;--fs-h2:40px;--fs-intro:27px;--fs-body:20px;--fs-h3:22px;--fs-tick:18px;--fs-small:15px;--hdh:84px;--sp4:72px}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --ink:#ededed; --line:#ededed; --muted:#b3b3b3;
    --btn:#ededed; --btn-ink:#111111; --soft:#1e1e1e; --alert:#ff8a7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --ink:#ededed; --line:#ededed; --muted:#b3b3b3;
  --btn:#ededed; --btn-ink:#111111; --soft:#1e1e1e; --alert:#ff8a7a;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box;font-weight:400}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45}
h1,h2,h3,p{margin:0}
h1,h2,h3,.logo,.mi{font-family:var(--f-title);letter-spacing:-.01em;line-height:1.15}
h1,h2,.logo,.mi{text-transform:uppercase}
h3{font-size:var(--fs-h3)}
button{font-family:var(--f-body);font-size:var(--fs-btn);color:inherit;cursor:pointer;border:0;background:none;padding:0;text-transform:uppercase;letter-spacing:.02em}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--m)}
main{padding-top:6px;padding-bottom:120px}

/* Header e sub-header fixos */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:var(--hdh)}
.logo{font-size:var(--fs-logo);text-align:left;white-space:nowrap}
.brandbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.tagline{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.2;white-space:nowrap}
@media (min-width:900px){.tagline{font-size:14px}}
.burger{width:44px;height:44px;display:grid;align-content:center;justify-items:end;gap:7px;text-transform:none}
.burger i{display:block;width:26px;height:1px;background:var(--ink);transition:transform .2s}
.burger.open i:nth-child(1){transform:translateY(4px) rotate(45deg)}
.burger.open i:nth-child(2){transform:translateY(-4px) rotate(-45deg)}
.sub{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdh) + 1px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.sub-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.sub h1{font-size:var(--fs-h1)}
.fam{display:flex;align-items:center;gap:4px;flex:none}
.fam button{width:36px;height:36px;font-size:20px;text-transform:none;border:1px solid var(--line);border-radius:50%}
.fam span{min-width:72px;text-align:center;font-size:var(--fs-small);text-transform:uppercase}

/* Menu */
.menu{display:none;position:fixed;inset:0;z-index:35;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + var(--hdh) + 1px);overflow-y:auto}
.menu.show{display:block}
.mi{display:block;width:100%;text-align:left;font-size:var(--fs-h1);padding:18px var(--m);border-bottom:1px solid var(--line);letter-spacing:-.01em}
.mi.on{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:8px}

/* Texto de introdução, pesquisa, ticker */
.intro{font-size:var(--fs-intro);line-height:1.3;margin:22px 0;max-width:38ch}
.intro.sm{font-size:var(--fs-h3);margin:12px 0}

.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);-webkit-appearance:none;appearance:none}
.search::-webkit-search-cancel-button,.search::-webkit-search-decoration{-webkit-appearance:none}
.sbox{position:relative}
.sbox .search{padding-right:46px}
.lupa{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;color:var(--muted)}
.search::placeholder{color:var(--muted)}
.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:16px}
.strip{display:flex;align-items:center;gap:10px;overflow-x:auto;white-space:nowrap;padding:11px 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip+.strip{border-top:1px solid var(--line)}
.slab{flex:none;color:var(--muted);font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.02em;margin:0}
.tk{flex:none;font-size:var(--fs-tick);padding:4px 0}
.tk.on{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.sq{flex:none;font-size:.55em;line-height:1}
.count{color:var(--muted);font-size:var(--fs-small);margin:14px 0 0}

/* Receitas */
.grp{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:var(--fs-h2);margin:var(--sp4) 0 var(--sp2);padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp small{font-family:var(--f-body);font-size:var(--fs-small);color:var(--muted);letter-spacing:.02em}
.gl{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:28px var(--gap)}
.lay-g1 .gl{--cols:1}.lay-g2 .gl{--cols:2}.lay-g3 .gl{--cols:3;gap:20px 10px}
.lay-g1 .ph{aspect-ratio:4/3}
.lay-g3 .ct{font-size:11px;margin-top:6px}.lay-g3 .cm{font-size:11px}.lay-g3 .cm+.cm{display:none}.lay-g3 .ph .phe{font-size:1.6rem}.lay-g3 .heart{width:30px;height:30px;font-size:14px}
.lay-list .gl{display:block}
.lay-list .card{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lay-list .ph{order:1;aspect-ratio:1/1;width:72px}.lay-list .cb{order:2;min-width:0}.lay-list .heart{order:3;position:static}
.lay-list .ct{margin:0 0 4px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 0}
.tools .count{margin:0}
.lay{display:flex;gap:6px}
.lay button{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
.lay button.on{background:var(--btn);color:var(--btn-ink)}
.lay svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){.gl{gap:40px 20px}.lay-g1 .gl{--cols:2}.lay-g2 .gl{--cols:4}.lay-g3 .gl{--cols:6;gap:28px 12px}.lay-g3 .ct{font-size:13px}.lay-g3 .cm{font-size:12px}}
.card{position:relative;display:block;cursor:pointer}
.ph{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden;display:grid;place-items:center;border-radius:0}
.ph .phe{font-size:2.4rem;opacity:.5}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.lg{aspect-ratio:4/3;margin:18px 0 0}
@media (min-width:900px){.ph{aspect-ratio:4/3}}
.ct{font-family:var(--f-title);font-size:var(--fs-body);text-transform:uppercase;letter-spacing:-.01em;line-height:1.15;margin:10px 0 5px}
.cm{color:var(--muted);font-size:var(--fs-small);line-height:1.4}
.heart{position:absolute;top:0;right:0;width:40px;height:40px;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-size:18px;text-transform:none}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.empty .btn{margin-top:16px}
.note{color:var(--muted);font-size:var(--fs-small);margin-top:var(--sp3);max-width:38ch}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:12px 20px;font-size:var(--fs-btn);text-transform:uppercase;letter-spacing:.02em;flex:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:11px 19px}
.btn.wide{width:100%}
.btn:active{opacity:.75}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar .btn{flex:1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:28;display:flex;justify-content:center;align-items:center;gap:20px;padding:0 var(--m);pointer-events:none}
.dk{pointer-events:auto;position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--btn);color:var(--btn-ink);border:1px solid var(--btn);border-radius:999px;padding:10px 9px;font-size:12px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;white-space:nowrap}
.dk svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dk.on{background:var(--bg);color:var(--ink);border-color:var(--line)}
.dk .bd{position:absolute;top:-7px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:11px;font-style:normal;display:grid;place-items:center;letter-spacing:0}
@media (min-width:640px){.dock{gap:20px}.dk{padding:12px 20px;font-size:var(--fs-btn);gap:8px}.dk svg{width:20px;height:20px}}
@media (max-width:359px){.dock{gap:6px}.dk{padding:9px;font-size:11px;gap:4px}.dk svg{width:14px;height:14px}}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:var(--fs-btn);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btn-ink)}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}

/* Semana */
.weekgrid{display:grid;grid-template-columns:1fr;column-gap:48px;margin-top:var(--sp3)}
@media (min-width:900px){.weekgrid{grid-template-columns:1fr 1fr}}
.day{border-top:1px solid var(--line);padding-top:14px;margin-bottom:var(--sp3)}
.day h2{font-size:var(--fs-h2)}
.tot{margin-top:4px;color:var(--muted);font-size:var(--fs-small)}
.slot{border-top:1px solid var(--line);padding:10px 0;margin-top:14px}
.slabel{color:var(--muted);font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.item{display:flex;align-items:center;gap:10px;padding:5px 0}
.item .nm{flex:1;min-width:0;text-align:left;text-transform:none;font-size:var(--fs-body);letter-spacing:0;line-height:1.3}
.ik{color:var(--muted);font-size:var(--fs-small);white-space:nowrap}
.x{flex:none;width:38px;height:38px;font-size:22px;line-height:1;text-transform:none;color:var(--ink)}
.add{margin-top:4px;padding:8px 0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

/* Compras */
.prog{margin:0 0 var(--sp2);border-top:1px solid var(--line);padding-top:12px}
.prog .pt{display:flex;justify-content:space-between;font-size:var(--fs-small);text-transform:uppercase;margin-bottom:8px}
.meter{height:3px;background:var(--soft)}
.meter i{display:block;height:100%;background:var(--btn);transition:width .25s}
@media (prefers-reduced-motion:reduce){.meter i,.burger i{transition:none}}
.aisles{margin-top:var(--sp2)}
@media (min-width:900px){.aisles{columns:2;column-gap:56px}}
.aisle{break-inside:avoid;margin-bottom:var(--sp3)}
.ah{font-family:var(--f-title);text-transform:uppercase;font-size:var(--fs-h3);padding-bottom:8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;text-transform:none;font-size:var(--fs-body);letter-spacing:0}
.xb{display:flex;align-items:center;gap:12px;flex:1;text-align:left;text-transform:none;font-size:var(--fs-body);letter-spacing:0}
.row.xr{padding:0 0 0 0}
.row.xr .xb{padding:12px 0}
.box{flex:none;width:22px;height:22px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;line-height:1}
.row.done .box{background:var(--btn);color:var(--btn-ink)}
.row .q{margin-left:auto;white-space:nowrap}
.row.done .n,.row.done .q{text-decoration:line-through;color:var(--muted)}
.addx{display:flex;gap:10px;align-items:center;margin:8px 0 18px}
.addx .search{flex:1}
.export{border-top:1px solid var(--line);margin-top:var(--sp3);padding-top:14px}
.export h2{font-size:var(--fs-h2);margin-bottom:10px}
textarea.txt{width:100%;min-height:220px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);padding:12px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;margin:8px 0;text-transform:none}

/* Folhas */
#sheetwrap{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#sheetwrap.show{display:flex}
.sheet{width:100%;max-width:1100px;max-height:94%;overflow-y:auto;background:var(--bg);color:var(--ink);border-top:1px solid var(--line);padding:0 var(--m) calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet.full{height:100%;max-height:100%;border-top:0}
@media (min-width:900px){.sheet.full{height:94%;max-height:94%}}
.shead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:6px}
.shead h2{font-size:var(--fs-h3)}
.close{flex:none;width:40px;height:40px;font-size:26px;line-height:1;text-transform:none;text-align:right}
.h1{font-size:var(--fs-h1);margin:22px 0 10px}
.cm.big{font-size:var(--fs-body)}
.blk{display:grid;grid-template-columns:1fr;gap:12px;margin-top:var(--sp4)}
.blk>h2{font-size:var(--fs-h2);border-top:1px solid var(--line);padding-top:14px}
@media (min-width:900px){.blk{grid-template-columns:5fr 7fr;gap:0 24px}}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.ing li span:last-child{white-space:nowrap}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;padding:12px 0;border-bottom:1px solid var(--line);max-width:38ch}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-title);color:var(--muted)}
.acc{border-bottom:1px solid var(--line)}
.acc summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;cursor:pointer;list-style:none;font-family:var(--f-title);font-size:var(--fs-h3);letter-spacing:-.01em;text-transform:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1.3em;line-height:1}
.acc[open] summary::after{content:"\2212"}
.acc p{padding:0 0 14px;max-width:38ch}
.nt{padding-bottom:12px}
.nr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:var(--fs-body)}
.nr:first-child{border-top:0}
.nr.big span:last-child{font-family:var(--f-title);font-size:var(--fs-h3)}
.pick{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);text-transform:none;font-size:var(--fs-body);letter-spacing:0}
.pick small{display:block;color:var(--muted);font-size:var(--fs-small);margin-top:2px}
.sheet .slab{margin:14px 0 0}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:var(--fs-btn);opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap hd-in">
    <div class="brandbox"><button class="logo" data-a="tab" data-v="recipes">Ambrosia</button></div>
    <button class="burger" data-a="menu" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
  </div>
</header>
<div class="sub">
  <div class="wrap sub-in">
    <h1 id="pagetitle">Receitas</h1>
    <div class="fam" role="group" aria-label="Número de pessoas">
      <button data-a="fam" data-d="-1" aria-label="Menos uma pessoa">−</button>
      <span id="famlabel">4 pessoas</span>
      <button data-a="fam" data-d="1" aria-label="Mais uma pessoa">+</button>
    </div>
  </div>
</div>
<nav id="menu" class="menu" aria-label="Navegação principal"></nav>
<div class="wrap"><main id="app"></main></div>
<nav class="dock" id="dock" aria-label="Navegação principal"></nav>
<div id="sheetwrap" data-a="overlay"></div>
<div id="toast" role="status"></div>

<script>
/* ============ DADOS ============ */
const H="Frutas e legumes",T="Talho",P="Peixaria",L="Laticínios e ovos",M="Mercearia",B="Padaria",C="Congelados";
const AISLES=[H,T,P,L,M,B,C,"Outros"];
const DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const SLOTS=["Pequeno-almoço","Almoço","Jantar"];
const CATS=["Todas","Carne","Peixe","Sopa","Massa e arroz","Vegetariano","Pequeno-almoço","Sobremesa"];
const r=(id,n,cat,t,e,veg,[k,p,h,a,g,f],ing,steps)=>({id,n,cat,t,e,veg,k,p,h,a,g,f,ing,steps});

const RECIPES=[
r("bacalhau-natas","Bacalhau com natas","Peixe",45,"🐟",false,[520,36,38,5,25,3],
 [["Bacalhau demolhado",600,"g",P],["Batata",600,"g",H],["Cebola",2,"un",H],["Natas",400,"ml",L],["Leite",200,"ml",L],["Farinha",30,"g",M],["Manteiga",30,"g",L],["Queijo ralado",60,"g",L],["Azeite",30,"ml",M]],
 ["Coza o bacalhau 5 minutos em água a ferver, escorra e desfaça em lascas.","Corte a batata em palitos e frite ou leve ao forno com azeite até ficar dourada.","Refogue a cebola em rodelas finas. Faça um molho com manteiga, farinha, leite e natas.","Misture o bacalhau, a batata e a cebola com o molho. Cubra com queijo e gratine 15 minutos a 200 ºC."]),

function fmt(q,u,ceil){
  if(u==="g"||u==="ml"){
    const step=ceil?10:5;
    const v=Math.max(step,(ceil?Math.ceil(q/step):Math.round(q/step))*step);
    if(v>=1000)return num(Math.round(v/10)/100)+(u==="g"?" kg":" l");
    return v+" "+u;
  }
  const v=ceil?Math.max(1,Math.ceil(q-1e-6)):Math.max(0.5,Math.round(q*2)/2);
  return num(v)+" "+u;
}

95]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj`+NL);offs[4]=len;push(`4 0 obj<</Type/XObject/Subtype/Image/Width `+w+`/Height `+h+`/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length `+jpeg.length+`>>stream`+NL);push(jpeg);push(NL+`endstream`+NL+`endobj`+NL);const cs=`q 842 0 0 595 0 0 cm /Im0 Do Q`;offs[5]=len;push(`5 0 obj<</Length `+cs.length+`>>stream`+NL+cs+NL+`endstream`+NL+`endobj`+NL);const xr=len;let x=`xref`+NL+`0 6`+NL+`0000000000 65535 f `+NL;for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,`0`)+` 00000 n `+NL;push(x+`trailer<</Size 6/Root 1 0 R>>`+NL+`startxref`+NL+xr+NL+`%%EOF`);return new Blob(parts,{type:`application/pdf`})}const blobOf=(cv,type,q)=>new Promise(res=>cv.toBlob(res,type,q));async function saveWeek(kind){if(!DL||!lastCv){toast(`Guardar ficheiros não está disponível aqui`);return}try{if(kind===`png`){const b=await blobOf(lastCv,`image/png`);await DL.save({filename:`ementa-semana.png`,data:b})}else{const b=await blobOf(lastCv,`image/jpeg`,0.92);const u=new Uint8Array(await b.arrayBuffer());await DL.save({filename:`ementa-semana.pdf`,data:makePdf(u,lastCv.width,lastCv.height)})}toast(`Ficheiro guardado`)}catch(e){if(!e||e.code!==`declined`)toast(`Não foi possível guardar o ficheiro`)}}function shopEntries(){const e=[];groupedShop().forEach(([a,items])=>{e.push({h:a});items.forEach(i=>e.push({n:i.n,q:i.txt,d:i.done}))});if(S.extras.length){e.push({h:`Outros`});S.extras.forEach(x=>e.push({n:x.t,q:``,d:x.done}))}return e}function drawShopPages(single){const W=1190,M=60,GAP=40,colW=(W-2*M-GAP)/2,RH=46,HRH=66,ents=shopEntries();let HH=1684;const top1=150,top2=100;if(single){const total=ents.reduce((s,e)=>s+(e.h?HRH:RH),0);HH=top1+Math.ceil(total/2)+2*(HRH+RH)+80}const bottom=HH-80,pages=[];let cv,g,col,y,top;const ft=(w,s)=>`400 `+s+`px Hanken Grotesk,Arimo,Arial,sans-serif`;const newPage=first=>{cv=document.createElement(`canvas`);cv.width=W;cv.height=HH;g=cv.getContext(`2d`);g.fillStyle=`#ffffff`;g.fillRect(0,0,W,HH);g.textBaseline=`middle`;if(first){g.fillStyle=`#111111`;g.fillRect(0,0,W,110);g.fillStyle=`#ffffff`;g.font=ft(800,46);g.textAlign=`left`;g.fillText(`LISTA DE COMPRAS`,M,55);g.font=ft(600,26);g.textAlign=`right`;g.fillText(pessoas(),W-M,55);top=top1}else{g.fillStyle=`#6b6b66`;g.font=ft(600,24);g.textAlign=`left`;g.fillText(`Lista de compras (continuação)`,M,50);top=top2}g.textAlign=`left`;col=0;y=top;pages.push(cv)};newPage(true);ents.forEach(e=>{const need=e.h?HRH+2*RH:RH;if(y+need>bottom){if(col===0){col=1;y=top}else newPage(false)}const x=M+col*(colW+GAP);if(e.h){g.fillStyle=`#111111`;g.font=ft(800,30);g.textAlign=`left`;g.fillText(e.h.toUpperCase(),x,y+HRH/2+4);g.strokeStyle=`#111111`;g.lineWidth=2;g.beginPath();g.moveTo(x,y+HRH-8);g.lineTo(x+colW,y+HRH-8);g.stroke();y+=HRH;return}g.strokeStyle=`#111111`;g.lineWidth=3;const bx=x,by=y+RH/2-14;if(e.d){g.fillStyle=`#111111`;g.fillRect(bx,by,28,28);g.strokeStyle=`#ffffff`;g.lineWidth=4;g.beginPath();g.moveTo(bx+6,by+15);g.lineTo(bx+12,by+21);g.lineTo(bx+22,by+8);g.stroke()}else g.strokeRect(bx,by,28,28);g.fillStyle=e.d?`#9b9990`:`#111111`;g.font=ft(700,24);g.textAlign=`right`;g.fillText(e.q,x+colW,y+RH/2);const qw=g.measureText(e.q).width;g.font=ft(500,24);g.textAlign=`left`;let nm=e.n;const maxW=colW-44-qw-16;while(nm.length>1&&g.measureText(nm).width>maxW)nm=nm.slice(0,-1);if(nm!==e.n)nm=nm.trimEnd()+`…`;g.fillText(nm,x+44,y+RH/2);if(e.d){const w=g.measureText(nm).width;g.strokeStyle=`#9b9990`;g.lineWidth=2;g.beginPath();g.moveTo(x+44,y+RH/2);g.lineTo(x+44+w,y+RH/2);g.stroke()}g.strokeStyle=`#efede7`;g.lineWidth=2;g.beginPath();g.moveTo(x+44,y+RH);g.lineTo(x+colW,y+RH);g.stroke();y+=RH});pages.forEach((c,i)=>{const k=c.getContext(`2d`);k.fillStyle=`#6b6b66`;k.font=ft(500,18);k.textAlign=`center`;k.textBaseline=`middle`;k.fillText(`Ambrosia   página `+(i+1)+` de `+pages.length,W/2,c.height-36)});return pages}function makePdfN(jpegs,w,h,pw,ph){const enc=s=>new TextEncoder().encode(s);const parts=[],offs=[];let len=0;const push=b=>{const u=typeof b===`string`?enc(b):b;parts.push(u);len+=u.length};const n=jpegs.length;push(`%PDF-1.4`+NL);offs[1]=len;push(`1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj`+NL);const kids=jpegs.map((_,i)=>(3+3*i)+` 0 R`).join(` `);offs[2]=len;push(`2 0 obj<</Type/Pages/Kids[`+kids+`]/Count `+n+`>>endobj`+NL);jpegs.forEach((jp,i)=>{const p=3+3*i;offs[p]=len;push(p+` 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 `+pw+` `+ph+`]/Resources<</XObject<</Im0 `+(p+1)+` 0 R>>>>/Contents `+(p+2)+` 0 R>>endobj`+NL);offs[p+1]=len;push((p+1)+` 0 obj<</Type/XObject/Subtype/Image/Width `+w+`/Height `+h+`/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length `+jp.length+`>>stream`+NL);push(jp);push(NL+`endstream`+NL+`endobj`+NL);const cs=`q `+pw+` 0 0 `+ph+` 0 0 cm /Im0 Do Q`;offs[p+2]=len;push((p+2)+` 0 obj<</Length `+cs.length+`>>stream`+NL+cs+NL+`endstream`+NL+`endobj`+NL)});const total=3+3*n;const xr=len;let x=`xref`+NL+`0 `+total+NL+`0000000000 65535 f `+NL;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,`0`)+` 00000 n `+NL;push(x+`trailer<</Size `+total+`/Root 1 0 R>>`+NL+`startxref`+NL+xr+NL+`%%EOF`);return new Blob(parts,{type:`application/pdf`})}async function saveShop(kind){if(!DL){toast(`Guardar ficheiros não está disponível aqui`);return}if(!shopEntries().length){toast(`A lista está vazia`);return}try{try{if(document.fonts&&document.fonts.load)await document.fonts.load(`400 20px Hanken Grotesk`)}catch(e){}if(kind===`png`){const pg=drawShopPages(true);const b=await blobOf(pg[0],`image/png`);await DL.save({filename:`lista-de-compras.png`,data:b})}else{const pg=drawShopPages(false);const js=[];for(const c of pg){const b=await blobOf(c,`image/jpeg`,0.92);js.push(new Uint8Array(await b.arrayBuffer()))}await DL.save({filename:`lista-de-compras.pdf`,data:makePdfN(js,1190,1684,595,842)})}toast(`Ficheiro guardado`)}catch(e){if(!e||e.code!==`declined`)toast(`Não foi possível guardar o ficheiro`)}}
function sWeekExp(){return `<div class='shead'><h2>Exportar calendário</h2><button class='close' data-a='close' aria-label='Fechar'>×</button></div><div id='cvwrap'><div class='empty'>A preparar a imagem…</div></div><div class='acts'>${DL?`<button class='btn' data-a='dlpng'>Guardar imagem (PNG)</button><button class='btn' data-a='dlpdf'>Guardar PDF</button>`:``}<button class='btn ghost' data-a='weektext'>Ver como texto</button></div>${DL?``:`<p class='note'>Guardar ficheiros não está disponível neste ecrã. Pode fazer uma captura de ecrã da imagem ou usar o texto.</p>`}`}
/* ============ RENDER GERAL ============ */
let menuOpen=false;
const MENU_ICONS={recipes:`<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M4 5.5A1 1 0 0 1 5 4.5H11V19.5H5A1 1 0 0 1 4 18.5Z'/><path d='M20 5.5A1 1 0 0 0 19 4.5H13V19.5H19A1 1 0 0 0 20 18.5Z'/></svg>`,week:`<svg viewBox='0 0 24 24' aria-hidden='true'><rect x='4' y='5' width='16' height='15' rx='1'/><path d='M4 10H20M8 3V7M16 3V7'/></svg>`,shop:`<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M5 8H19L18 20H6Z'/><path d='M9 8V7a3 3 0 0 1 6 0V8'/></svg>`};
function renderChrome(){
  $(`#pagetitle`).textContent=TITLES[view];
  $(`#famlabel`).textContent=pessoas();
  const p=pending();
  $(`#dock`).innerHTML=[[`recipes`,`Receitas`],[`week`,`Semana`],[`shop`,`Compras`]].map(([k,l])=>`<button class='dk ${view===k?`on`:``}' data-a='tab' data-v='${k}' ${view===k?`aria-current='page'`:``}>${MENU_ICONS[k]}<span>${l}</span>${k===`shop`&&p?`<i class='bd'>${p}</i>`:``}</button>`).join(``);
  const m=$(`#menu`);
  m.innerHTML=[[`recipes`,`Receitas`],[`week`,`Semana`],[`shop`,`Compras`+(p?` (${p})`:``)]].map(([k,l])=>`<button class='mi ${view===k?`on`:``}' data-a='tab' data-v='${k}' ${view===k?`aria-current='page'`:``}>${l}</button>`).join(``);
  m.classList.toggle(`show`,menuOpen);
  const b=$(`.burger`);b.setAttribute(`aria-expanded`,String(menuOpen));b.classList.toggle(`open`,menuOpen);
}
function render(){
  $(`#app`).innerHTML=view===`recipes`?vRecipes():view===`week`?vWeek():vShop();
  renderChrome();
  if(view===`recipes`)renderList();
}
function todayName(){const d=new Date().getDay();return DAYS[d===0?6:d-1]}

/* ============ SUGERIR SEMANA ============ */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function suggest(){
  const used=new Set(Object.values(S.plan).flat());
  const pool=(f)=>shuffle(RECIPES.filter(f));
  const pools={bf:pool(x=>x.cat==="Pequeno-almoço"),soup:pool(x=>x.cat==="Sopa"),main:pool(x=>["Carne","Peixe","Vegetariano","Massa e arroz"].includes(x.cat)),des:pool(x=>x.cat==="Sobremesa")};
  const take=(k)=>{const p=pools[k];const f=p.find(x=>!used.has(x.id))||p[0];used.add(f.id);return f.id};
  let filled=0;
  const put=(d,s,k)=>{if(!slotItems(d,s).length){S.plan[pk(d,s)]=[take(k)];filled++}};
  DAYS.forEach((d,i)=>{
    put(d,"Pequeno-almoço","bf");
    put(d,"Almoço","main");
    put(d,"Jantar",i%2===0?"soup":"main");
  });
  ["Sábado","Domingo"].forEach(d=>{const ids=slotItems(d,"Almoço");if(ids.length===1&&BY[ids[0]].cat!=="Sobremesa"){S.plan[pk(d,"Almoço")].push(take("des"))}});
  save();render();toast(filled?"Semana sugerida":"Todos os espaços já estão preenchidos");
}

/* ============ AÇÕES ============ */
function act(a,el,e){
  const id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case "overlay": if(e.target===el){sheet=null;renderSheet()} break;
    case "close": sheet=null;renderSheet();break;
    case "tab": view=v;sheet=null;menuOpen=false;clearArm=false;renderSheet();render();window.scrollTo(0,0);break;
    case `menu`: menuOpen=!menuOpen;document.body.style.overflow=(menuOpen||sheet)?`hidden`:``;renderChrome();break;
    case `pill`: if(view===`shop`){const el=$(`#exportsec`);if(el)el.scrollIntoView({behavior:`smooth`,block:`start`})}else{view=view===`recipes`?`week`:`shop`;sheet=null;renderSheet();render();window.scrollTo(0,0)}break;
    case "fam": S.family=Math.min(12,Math.max(1,S.family+Number(el.dataset.d)));save();render();if(sheet)renderSheet();break;
    case "cat": F.cat=v;render();break;
    case `aut`: F.aut=v;render();break;
    case `lay`: S.layout=v;save();render();break;
    
    case "flag": F.flags[v]=!F.flags[v];render();break;
    case "fav": {e.stopPropagation();const i=S.favs.indexOf(id);if(i>=0)S.favs.splice(i,1);else S.favs.push(id);save();if(view==="recipes")renderList();if(sheet&&sheet.type==="detail")renderSheet();break}
    case "open": sheet={type:"detail",id};renderSheet();break;
    case "addsheet": {const rc=BY[id];sheet={type:"add",id,day:todayName(),slot:rc.cat==="Pequeno-almoço"?"Pequeno-almoço":"Almoço"};renderSheet();break}
    case "setday": sheet.day=v;renderSheet();break;
    case "setslot": sheet.slot=v;renderSheet();break;
    case "confirmadd": {const k=pk(sheet.day,sheet.slot);(S.plan[k]=S.plan[k]||[]).push(sheet.id);save();toast("Adicionado a "+sheet.day+" ("+sheet.slot.toLowerCase()+")");sheet=null;renderSheet();render();break}
    case "pick": sheet={type:"pick",day:el.dataset.d,slot:el.dataset.s,q:"",all:false};renderSheet();break;
    case "pickall": sheet.all=!sheet.all;renderSheet();break;
    case "pickadd": {const k=pk(sheet.day,sheet.slot);(S.plan[k]=S.plan[k]||[]).push(id);save();toast("Adicionado");sheet=null;renderSheet();render();break}
    case "rm": {const k=pk(el.dataset.d,el.dataset.s);S.plan[k].splice(Number(el.dataset.i),1);save();render();break}
    case "suggest": suggest();break;
    case "clear":
      if(!clearArm){clearArm=true;render();clearTimeout(act.t);act.t=setTimeout(()=>{clearArm=false;if(view==="week")render()},3000)}
      else{S.plan={};S.checked={};clearArm=false;save();render();toast("Semana limpa")}
      break;
    case "chk": S.checked[el.dataset.k]=!S.checked[el.dataset.k];save();render();break;
    case "chkx": {const x=S.extras[Number(el.dataset.i)];x.done=!x.done;save();render();break}
    case "rmx": S.extras.splice(Number(el.dataset.i),1);save();render();break;
    case "addx": {const inp=$("#xin");const t=inp.value.trim();if(t){S.extras.push({t,done:false});save();render();$("#xin").focus()}break}
    case "uncheck": S.checked={};S.extras.forEach(x=>x.done=false);save();render();break;
    case "opt": opt[v]=!opt[v];render();break;
    case "copyshop": copyText(shopText(opt));break;
    case "shareshop": shareText("Lista de compras",shopText(opt));break;
    case "exprecipe": {const rc=BY[id];sheet={type:"export",title:rc.n,text:recipeText(rc)};renderSheet();break}
    case "copysheet": copyText(sheet.text);break;
    case `weekexp`: if(!Object.values(S.plan).some(a=>a.length)){toast(`Adicione primeiro receitas à semana`);break}sheet={type:`weekexp`};renderSheet();buildPreview();break;
    case `dlpng`: saveWeek(`png`);break;
    case `dlpdf`: saveWeek(`pdf`);break;
    case `shoppdf`: saveShop(`pdf`);break;
    case `shoppng`: saveShop(`png`);break;
    case `weektext`: sheet={type:`export`,title:`Plano da semana`,text:planText()};renderSheet();break;
    case "sharesheet": shareText(sheet.title,sheet.text);break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el)act(el.dataset.a,el,e)});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="xin"){act("addx",e.target,e)}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){e.preventDefault();act("open",e.target,e)}
  if(e.key==="Escape"){if(sheet){sheet=null;renderSheet()}else if(menuOpen){menuOpen=false;renderChrome();document.body.style.overflow=""}}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){F.q=e.target.value;renderList()}
  if(e.target.id==="pq"){sheet.q=e.target.value;$("#plist").innerHTML=pickList()}
});
render();
</script>
