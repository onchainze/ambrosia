<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ea0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ementa">
<title>Ementa da Família</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --surface:#ffffff; --ink:#14213d; --muted:#5d6b85; --line:#dde5f0;
  --primary:#1d4ea0; --primary-ink:#ffffff; --primary-soft:#e3ecfb;
  --lemon:#f4c430; --lemon-ink:#3a2e00;
  --tomato:#d9482b; --olive:#4f7a2f; --olive-soft:#e5f0da;
  --tile:#e8effb; --tile-dot:#b9cdf0;
  --bar-p:#1d4ea0; --bar-h:#f4c430; --bar-g:#d9482b;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.07);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1526; --surface:#162038; --ink:#e9eef9; --muted:#9aa8c4; --line:#27344f;
    --primary:#7ba5f2; --primary-ink:#0b1630; --primary-soft:#1d2c4d;
    --lemon:#f4c430; --lemon-ink:#2a2100;
    --tomato:#ff7b5f; --olive:#9cc97a; --olive-soft:#223019;
    --tile:#1c2a4a; --tile-dot:#2f4673;
    --bar-p:#7ba5f2; --bar-h:#f4c430; --bar-g:#ff7b5f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1526; --surface:#162038; --ink:#e9eef9; --muted:#9aa8c4; --line:#27344f;
  --primary:#7ba5f2; --primary-ink:#0b1630; --primary-soft:#1d2c4d;
  --lemon:#f4c430; --lemon-ink:#2a2100;
  --tomato:#ff7b5f; --olive:#9cc97a; --olive-soft:#223019;
  --tile:#1c2a4a; --tile-dot:#2f4673;
  --bar-p:#7ba5f2; --bar-h:#f4c430; --bar-g:#ff7b5f;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--primary);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);color:var(--primary-ink)}
:root[data-theme="dark"] .top, :root:not([data-theme="light"]) .top{}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.fam{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.fam button{width:34px;height:34px;border-radius:50%;font-size:1.2rem;font-weight:700;color:inherit}
.fam button:active{background:rgba(255,255,255,.25)}
.fam span{min-width:88px;text-align:center;font-weight:600;font-size:.92rem}

main{padding:16px 16px 110px}

/* Pesquisa e filtros */
.search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.alt.on{background:var(--lemon);border-color:var(--lemon);color:var(--lemon-ink)}
.count{color:var(--muted);font-size:.9rem;margin:14px 2px 8px}

/* Cartões de receitas */
.list{display:grid;gap:10px}
@media(min-width:560px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);cursor:pointer}
.thumb{flex:none;width:68px;height:68px;border-radius:14px;display:grid;place-items:center;font-size:2rem;background-color:var(--tile);background-image:radial-gradient(var(--tile-dot) 1.6px,transparent 1.8px);background-size:9px 9px}
.cbody{min-width:0;flex:1;padding-right:30px}
.card h3{font-size:1.02rem;font-weight:700;margin-bottom:3px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:.82rem}
.tag{background:var(--olive-soft);color:var(--olive);padding:0 8px;border-radius:999px;font-weight:600}
.nut{margin-top:4px;font-size:.84rem;color:var(--muted)}
.nut b{color:var(--ink);font-weight:700}
.heart{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;font-size:1.2rem;color:var(--line);display:grid;place-items:center}
.heart.on{color:var(--tomato)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.note{color:var(--muted);font-size:.82rem;margin-top:18px;text-align:center}

.srcbadge{margin-top:5px;font-size:.78rem;font-weight:600;color:var(--primary);background:var(--primary-soft);display:inline-block;padding:2px 9px;border-radius:8px}.srcbox{background:var(--primary-soft);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:.92rem}.srcbox a{color:var(--primary);font-weight:700}.srcbox small{color:var(--muted)}
.gl{display:grid;gap:10px}@media(min-width:560px){.gl{grid-template-columns:1fr 1fr}}#rlist.list{display:block}.grp{display:flex;align-items:baseline;gap:8px;font-size:1.3rem;margin:22px 2px 10px}.grp small{font-family:Figtree,system-ui,sans-serif;font-size:.85rem;color:var(--muted);font-weight:600}.flab{flex:none;align-self:center;font-weight:700;font-size:.82rem;color:var(--muted)}
/* Semana */
.bar{display:flex;gap:8px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:700;background:var(--primary);color:var(--primary-ink);flex:1}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.lemon{background:var(--lemon);color:var(--lemon-ink)}
.btn.warn{background:var(--tomato);color:#fff}
.btn:active{transform:scale(.98)}
.day{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.day header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.day h3{font-size:1.2rem}
.tot{font-size:.8rem;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:999px;font-weight:600}
.slot{padding:8px 0;border-top:1px solid var(--line)}
.slabel{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.item{display:flex;align-items:center;gap:8px;padding:6px 0}
.item .nm{flex:1;min-width:0;font-weight:600;cursor:pointer}
.item small{color:var(--muted);white-space:nowrap}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:1.3rem;line-height:1}
.x:active{background:var(--primary-soft)}
.add{color:var(--primary);font-weight:700;font-size:.92rem;padding:6px 0}

/* Compras */
.prog{background:var(--primary-soft);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.prog .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.meter{height:10px;border-radius:99px;background:var(--surface);overflow:hidden}
.meter i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .25s}
.aisle{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:6px 14px 8px;margin-bottom:12px}
.aisle h3{font-size:1.02rem;padding:10px 0 4px;color:var(--primary)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-size:.9rem;font-weight:800}
.row.done .box{background:var(--olive);border-color:var(--olive)}
.row .q{margin-left:auto;font-weight:700;white-space:nowrap}
.row.done .n,.row.done .q{text-decoration:line-through;color:var(--muted);font-weight:500}
.addx{display:flex;gap:8px;margin:4px 0 14px}
.addx .search{flex:1}
.addx .btn{flex:none}
.export{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.export h3{margin-bottom:10px;font-size:1.1rem}
textarea.txt{width:100%;min-height:220px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;font:.82rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;margin:10px 0}

/* Folhas (sheets) */
#sheetwrap{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,18,36,.55);align-items:flex-end;justify-content:center}
#sheetwrap.show{display:flex}
.sheet{width:100%;max-width:680px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.meter i{transition:none}}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.shead .thumb{width:72px;height:72px;font-size:2.2rem}
.shead h2{font-size:1.4rem;flex:1}
.shead .meta{margin-top:4px}
.close{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:1.3rem;align-self:flex-start}
.nbox{background:var(--bg);border-radius:16px;padding:14px;margin:6px 0 16px}
.kcal{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.1rem;font-weight:800;line-height:1}
.kcal small{font-family:"Figtree",system-ui,sans-serif;font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 10px}
.stack i{display:block;height:100%}
.ngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ngrid div{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;padding:6px 10px;background:var(--surface);border-radius:10px}
.ngrid b{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.sheet h3.sec{font-size:1.1rem;margin:18px 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing b{white-space:nowrap}
.steps{margin:0;padding-left:22px}
.steps li{margin-bottom:8px;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line)}
.pick .thumb{width:46px;height:46px;font-size:1.4rem;border-radius:11px}
.pick .nm{flex:1;font-weight:600}
.pick small{color:var(--muted);display:block;font-weight:400}

/* Barra de separadores */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tab{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;font-weight:600;color:var(--muted);position:relative}
.tab span.ic{font-size:1.4rem;line-height:1.2}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--lemon)}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--tomato);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 6px;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Ementa da Família</div>
    <div class="fam" role="group" aria-label="Número de pessoas">
      <button data-a="fam" data-d="-1" aria-label="Menos uma pessoa">−</button>
      <span id="famlabel">4 pessoas</span>
      <button data-a="fam" data-d="1" aria-label="Mais uma pessoa">+</button>
    </div>
  </div>
</header>
<div class="wrap"><main id="app"></main></div>
<nav class="tabs" aria-label="Navegação principal"><div class="wrap" id="tabs"></div></nav>
<div id="sheetwrap" data-a="overlay"></div>
<div id="toast" role="status"></div>

<script>
/* ============ DADOS ============ */
const H="Frutas e legumes",T="Talho",P="Peixaria",L="Laticínios e ovos",M="Mercearia",B="Padaria",C="Congelados";
const AISLES=[H,T,P,L,M,B,C,"Outros"];
const DAYS=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const SLOTS=["Pequeno-almoço","Almoço","Jantar"];
const CATS=["Todas","Carne","Peixe","Sopa","Massa e arroz","Vegetariano","Pequeno-almoço","Sobremesa"];
const r=(id,n,cat,t,e,veg,[k,p,h,a,g,f],ing,steps)=>({id,n,cat,t,e,veg,k,p,h,a,g,f,ing,steps});

const RECIPES=[
r("bacalhau-natas","Bacalhau com natas","Peixe",45,"🐟",false,[520,36,38,5,25,3],
 [["Bacalhau demolhado",600,"g",P],["Batata",600,"g",H],["Cebola",2,"un",H],["Natas",400,"ml",L],["Leite",200,"ml",L],["Farinha",30,"g",M],["Manteiga",30,"g",L],["Queijo ralado",60,"g",L],["Azeite",30,"ml",M]],
 ["Coza o bacalhau 5 minutos em água a ferver, escorra e desfaça em lascas.","Corte a batata em palitos e frite ou leve ao forno com azeite até ficar dourada.","Refogue a cebola em rodelas finas. Faça um molho com manteiga, farinha, leite e natas.","Misture o bacalhau, a batata e a cebola com o molho. Cubra com queijo e gratine 15 minutos a 200 ºC."]),
r("arroz-frango","Arroz de frango","Massa e arroz",50,"🍗",false,[560,38,60,3,16,3],
 [["Frango (coxas ou peito)",600,"g",T],["Arroz",300,"g",M],["Cebola",1,"un",H],["Cenoura",2,"un",H],["Tomate",2,"un",H],["Ervilhas congeladas",150,"g",C],["Alho (dentes)",3,"un",H],["Azeite",30,"ml",M]],
 ["Refogue a cebola e o alho em azeite, junte o frango aos pedaços e deixe corar.","Adicione o tomate picado, a cenoura às rodelas e água a cobrir. Cozinhe 20 minutos.","Junte o arroz e as ervilhas com água quente (cerca de 2 vezes o volume do arroz).","Cozinhe 12 a 15 minutos, deixe repousar 5 minutos e sirva."]),
r("caldo-verde","Caldo verde","Sopa",35,"🥬",false,[190,6,20,2,9,4],
 [["Batata",500,"g",H],["Couve galega",200,"g",H],["Cebola",1,"un",H],["Alho (dentes)",2,"un",H],["Chouriço",80,"g",T],["Azeite",40,"ml",M]],
 ["Cozinhe a batata com a cebola e o alho em água com sal até ficar macia.","Triture tudo e leve ao lume de novo.","Corte a couve em tiras finíssimas e junte à sopa. Cozinhe 5 minutos.","Sirva com rodelas de chouriço e um fio de azeite."]),
r("sopa-legumes","Sopa de legumes","Sopa",30,"🥕",true,[120,4,18,5,4,5],
 [["Batata",300,"g",H],["Cenoura",300,"g",H],["Curgete",1,"un",H],["Cebola",1,"un",H],["Couve",150,"g",H],["Azeite",30,"ml",M]],
 ["Descasque e corte os legumes em pedaços.","Cozinhe em água com sal cerca de 25 minutos.","Triture e acerte o sal. Sirva com um fio de azeite."]),
r("bolonhesa","Esparguete à bolonhesa","Massa e arroz",40,"🍝",false,[600,32,70,8,20,5],
 [["Esparguete",320,"g",M],["Carne picada",400,"g",T],["Cebola",1,"un",H],["Cenoura",1,"un",H],["Alho (dentes)",2,"un",H],["Tomate triturado",400,"g",M],["Azeite",20,"ml",M]],
 ["Refogue a cebola, o alho e a cenoura ralada em azeite.","Junte a carne picada e deixe alourar bem, desfazendo com a colher.","Adicione o tomate e cozinhe em lume brando 25 minutos.","Coza o esparguete, escorra e sirva com o molho."]),
r("dourada-grelhada","Dourada grelhada com legumes","Peixe",30,"🐠",false,[410,35,32,3,16,5],
 [["Dourada (limpa)",4,"un",P],["Batata",600,"g",H],["Brócolos",400,"g",H],["Limão",1,"un",H],["Azeite",40,"ml",M]],
 ["Tempere a dourada com sal e limão. Cozinhe a batata e os brócolos em água com sal.","Grelhe a dourada 6 a 7 minutos de cada lado.","Sirva com azeite e fatias de limão."]),
r("feijoada","Feijoada à portuguesa","Carne",100,"🍲",false,[700,38,60,5,32,14],
 [["Feijão encarnado cozido",500,"g",M],["Entremeada",200,"g",T],["Chouriço",150,"g",T],["Couve",200,"g",H],["Cenoura",2,"un",H],["Cebola",1,"un",H],["Arroz",200,"g",M]],
 ["Refogue a cebola com a entremeada e o chouriço em pedaços.","Junte a cenoura, o feijão e água. Cozinhe 40 minutos em lume brando.","Adicione a couve às tiras nos últimos 15 minutos.","Cozinhe o arroz à parte e sirva a acompanhar."]),
r("omelete-espinafres","Omelete de espinafres","Vegetariano",20,"🍳",true,[290,19,6,3,21,3],
 [["Ovos",8,"un",L],["Espinafres",300,"g",H],["Cebola",1,"un",H],["Queijo ralado",80,"g",L],["Tomate",2,"un",H],["Alface",1,"un",H],["Azeite",20,"ml",M]],
 ["Refogue a cebola e os espinafres até murcharem.","Bata os ovos com sal e queijo, deite sobre os espinafres.","Cozinhe em lume brando até firmar, vire e acabe de cozer.","Sirva com salada de alface e tomate."]),
r("lasanha-legumes","Lasanha de legumes","Vegetariano",60,"🧀",true,[480,22,52,9,20,6],
 [["Massa de lasanha",250,"g",M],["Curgete",2,"un",H],["Cenoura",2,"un",H],["Cebola",1,"un",H],["Tomate triturado",400,"g",M],["Leite",500,"ml",L],["Farinha",40,"g",M],["Manteiga",40,"g",L],["Mozarela",200,"g",L]],
 ["Refogue a cebola, a curgete e a cenoura ralada. Junte o tomate e cozinhe 15 minutos.","Faça o bechamel: derreta a manteiga, junte a farinha e depois o leite aos poucos.","Monte em camadas: massa, legumes, bechamel. Termine com mozarela.","Leve ao forno 30 minutos a 190 ºC."]),
r("frango-forno","Frango assado com batatas","Carne",75,"🍗",false,[520,40,35,2,24,4],
 [["Pernas de frango",1000,"g",T],["Batata",800,"g",H],["Cebola",1,"un",H],["Alho (dentes)",3,"un",H],["Vinho branco",100,"ml",M],["Azeite",40,"ml",M]],

const $=s=>document.querySelector(s);

const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function fmt(q,u,ceil){
  if(u==="g"||u==="ml"){
    const step=ceil?10:5;
    const v=Math.max(step,(ceil?Math.ceil(q/step):Math.round(q/step))*step);
    if(v>=1000)return num(Math.round(v/10)/100)+(u==="g"?" kg":" l");
    return v+" "+u;
  }
  const v=ceil?Math.max(1,Math.ceil(q-1e-6)):Math.max(0.5,Math.round(q*2)/2);
  return num(v)+" "+u;
}
const scaled=(rc)=>rc.ing.map(([n,q,u,s])=>({n,u,s,txt:fmt(q*S.family/4,u,false)}));

function shopItems(){
  const m={};
  for(const k in S.plan){for(const id of S.plan[k]){const rc=BY[id];if(!rc)continue;
    for(const [n,q,u,sec] of rc.ing){const key=n+"|"+u;(m[key]=m[key]||{key,n,u,sec,q:0}).q+=q*S.family/4}}}
  return Object.values(m).map(i=>({...i,txt:fmt(i.q,i.u,true),done:!!S.checked[i.key]}));
}
function groupedShop(){
  const items=shopItems(),g={};
  items.forEach(i=>(g[i.sec]=g[i.sec]||[]).push(i));

  return AISLES.filter(a=>g[a]).map(a=>[a,g[a]]);

function recipeText(rc){
  let t=rc.n.toUpperCase()+"\nPara "+pessoas()+" | "+rc.t+" min\n"+(rc.src?"Fonte: "+rc.src.a+", "+rc.src.l+(rc.src.u?" ("+rc.src.u+")":"")+"\n":"")+"\n";
  t+="Por pessoa: "+rc.k+" kcal | Proteína "+rc.p+" g | Hidratos "+rc.h+" g (açúcares "+rc.a+" g) | Gordura "+rc.g+" g | Fibra "+rc.f+" g\n\n";
  t+="INGREDIENTES (lista para o supermercado)\n"+scaled(rc).map(i=>"[ ] "+i.n+" - "+i.txt).join("\n");
  t+="\n\nPREPARAÇÃO\n"+rc.steps.map((s,i)=>(i+1)+". "+s).join("\n");
  return t;
}
function planText(){
  let t="PLANO DA SEMANA\n";
  DAYS.forEach(d=>{
    const lines=SLOTS.map(s=>{const ids=slotItems(d,s);return ids.length?"  "+s+": "+ids.map(i=>BY[i].n).join(" + "):null}).filter(Boolean);
    if(lines.length)t+="\n"+d+"\n"+lines.join("\n")+"\n";
  });
  return t;
}
function shopText(o){
  const groups=groupedShop();
  let t="LISTA DE COMPRAS ("+pessoas()+")\n";
  if(!groups.length&&!S.extras.length)t+="\n(vazia)\n";
  groups.forEach(([a,items])=>{t+="\n"+a.toUpperCase()+"\n"+items.map(i=>"["+(i.done?"x":" ")+"] "+i.n+" - "+i.txt).join("\n")+"\n"});
  if(S.extras.length)t+="\nOUTROS\n"+S.extras.map(e=>"["+(e.done?"x":" ")+"] "+e.t).join("\n")+"\n";
  if(o.plan)t+="\n"+planText();
  if(o.recipes){
    const ids=[...new Set(Object.values(S.plan).flat())];
    if(ids.length)t+="\nRECEITAS\n\n"+ids.map(i=>recipeText(BY[i])).join("\n\n----------\n\n")+"\n";
  }
  return t.trim();
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("Copiado!")}
  catch(e){const ta=$("#exptext");if(ta){ta.focus();ta.select();try{document.execCommand("copy");toast("Copiado!")}catch(_){toast("Selecione o texto e copie")}}else toast("Não foi possível copiar")}
}
function shareText(title,t){
  if(navigator.share){navigator.share({title,text:t}).catch(()=>{})}else copyText(t);
}

}
function filtered(){
  const q=norm(F.q.trim());
  return RECIPES.filter(x=>{
    if(F.cat!=="Todas"&&x.cat!==F.cat)return false;
    if(F.aut!==`Todos os autores`){if(F.aut===`Receitas da casa`){if(x.src)return false}else if(!x.src||x.src.a!==F.aut)return false}
    
    const f=F.flags;
    if(f.fav&&!isFav(x.id))return false;
    if(f.quick&&x.t>30)return false;
    if(f.light&&x.k>400)return false;
    if(f.prot&&x.p<30)return false;
    if(f.lows&&x.a>5)return false;
    if(f.veg&&!x.veg)return false;
    if(q&&!(norm(x.n).includes(q)||x.ing.some(i=>norm(i[0]).includes(q))||(x.src&&norm(x.src.a+" "+x.src.l).includes(q))))return false;
    return true;
  });
}

function dayTotals(d){
  let k=0,p=0,a=0,n=0;
  SLOTS.forEach(s=>slotItems(d,s).forEach(id=>{const x=BY[id];if(x){k+=x.k;p+=x.p;a+=x.a;n++}}));
  return n?{k,p:Math.round(p),a:Math.round(a)}:null;
}
function vWeek(){
  const any=Object.values(S.plan).some(a=>a.length);
  let h=`<div class="bar"><button class="btn lemon" data-a="suggest">✨ Sugerir semana</button>
  <button class="btn ghost" data-a="clear">${clearArm?"Toque para confirmar":"Limpar"}</button></div><button class="btn ghost" style="width:100%;margin-bottom:12px" data-a="weekexp">Exportar calendário (PDF ou imagem)</button>
  <p class="note" style="margin:0 0 14px;text-align:left">A sugestão preenche só os espaços vazios. Os totais são por pessoa.</p>`;
  DAYS.forEach(d=>{
    const t=dayTotals(d);
    h+=`<section class="day"><header><h3>${d}</h3>${t?`<span class="tot">${t.k} kcal, ${t.p} g proteína, ${t.a} g açúcar</span>`:""}</header>`;
    SLOTS.forEach(s=>{
      h+=`<div class="slot"><div class="slabel">${s}</div>`;
      slotItems(d,s).forEach((id,i)=>{const x=BY[id];if(!x)return;
        h+=`<div class="item"><span class="nm" data-a="open" data-id="${id}">${x.e} ${esc(x.n)}</span><small>${x.k} kcal</small><button class="x" data-a="rm" data-d="${d}" data-s="${s}" data-i="${i}" aria-label="Remover">×</button></div>`});
      h+=`<button class="add" data-a="pick" data-d="${d}" data-s="${s}">+ Adicionar</button></div>`;
    });
    h+=`</section>`;
  });
  return h;
}
function vShop(){
  const groups=groupedShop(),items=shopItems();
  const total=items.length+S.extras.length,done=items.filter(i=>i.done).length+S.extras.filter(e=>e.done).length;
  let h="";
  if(total){
    h+=`<div class="prog"><div class="t"><span>${total-done===0?"Compras completas":"Faltam "+(total-done)+" de "+total}</span><span>${pessoas()}</span></div><div class="meter"><i style="width:${Math.round(done/total*100)}%"></i></div></div>`;
  }else{
    h+=`<div class="empty">A lista está vazia. Adicione receitas à semana e os ingredientes aparecem aqui, já somados.<div class="acts" style="justify-content:center"><button class="btn" style="flex:none" data-a="tab" data-v="week">Planear a semana</button></div></div>`;
  }
  groups.forEach(([a,list])=>{
    h+=`<section class="aisle"><h3>${a}</h3>${list.map(i=>`<button class="row ${i.done?"done":""}" data-a="chk" data-k="${esc(i.key)}"><span class="box">${i.done?"✓":""}</span><span class="n">${esc(i.n)}</span><span class="q">${i.txt}</span></button>`).join("")}</section>`;
  });
  if(S.extras.length){
    h+=`<section class="aisle"><h3>Outros</h3>${S.extras.map((e,i)=>`<div class="row ${e.done?"done":""}" style="gap:6px"><button class="row ${e.done?"done":""}" style="border:0;padding:0;flex:1" data-a="chkx" data-i="${i}"><span class="box">${e.done?"✓":""}</span><span class="n">${esc(e.t)}</span></button><button class="x" data-a="rmx" data-i="${i}" aria-label="Apagar">×</button></div>`).join("")}</section>`;
  }
  h+=`<div class="addx"><input id="xin" class="search" placeholder="Adicionar outro artigo" autocomplete="off"><button class="btn" data-a="addx">Adicionar</button></div>`;
  if(done)h+=`<button class="btn ghost" style="width:100%;margin-bottom:14px" data-a="uncheck">Desmarcar tudo</button>`;

   <div class="opt">${chip("Incluir plano da semana",opt.plan,"opt",'data-v="plan"',"alt")}${chip("Incluir receitas completas",opt.recipes,"opt",'data-v="recipes"',"alt")}</div>

}

function nutBox(rc){
  const pc=rc.p*4,hc=rc.h*4,gc=rc.g*9,tot=pc+hc+gc||1;
  const w=x=>(x/tot*100).toFixed(1)+"%";
  return `<div class="nbox"><div class="kcal">${rc.k}<small>kcal por pessoa</small></div>
    <div class="stack" aria-hidden="true"><i style="width:${w(pc)};background:var(--bar-p)"></i><i style="width:${w(hc)};background:var(--bar-h)"></i><i style="width:${w(gc)};background:var(--bar-g)"></i></div>
    <div class="ngrid">
      <div><span><span class="dot" style="background:var(--bar-p)"></span>Proteína</span><b>${rc.p} g</b></div>
      <div><span><span class="dot" style="background:var(--bar-h)"></span>Hidratos</span><b>${rc.h} g</b></div>
      <div><span>dos quais açúcares</span><b>${rc.a} g</b></div>
      <div><span><span class="dot" style="background:var(--bar-g)"></span>Gordura</span><b>${rc.g} g</b></div>
      <div><span>Fibra</span><b>${rc.f} g</b></div>
    </div></div>`;
}
function sDetail(rc){
  return `<div class="shead"><div class="thumb">${rc.e}</div><div style="flex:1;min-width:0"><h2>${esc(rc.n)}</h2><div class="meta"><span>⏱ ${rc.t} min</span><span>${rc.cat}</span>${rc.veg?'<span class="tag">Vegetariano</span>':""}</div></div><button class="close" data-a="close" aria-label="Fechar">×</button></div>
  ${srcBlock(rc)}${nutBox(rc)}

}
function sAdd(){
  const rc=BY[sheet.id];
  return `<div class="shead"><h2>Adicionar à semana</h2><button class="close" data-a="close" aria-label="Fechar">×</button></div>
  <p style="margin:0 0 6px;color:var(--muted)">${rc.e} ${esc(rc.n)}</p>

}
function pickList(){
  const q=norm(sheet.q||"");
  let L=RECIPES.filter(x=>sheet.all||(sheet.slot==="Pequeno-almoço"?x.cat==="Pequeno-almoço":x.cat!=="Pequeno-almoço"));
  if(q)L=RECIPES.filter(x=>norm(x.n).includes(q));
  return L.map(x=>`<button class="pick" data-a="pickadd" data-id="${x.id}"><div class="thumb">${x.e}</div><span class="nm">${esc(x.n)}<small>${x.cat}, ${x.k} kcal, ${x.p} g proteína</small></span></button>`).join("")||`<div class="empty">Sem resultados.</div>`;
}
function sPick(){
  return `<div class="shead"><h2>${sheet.day}: ${sheet.slot.toLowerCase()}</h2><button class="close" data-a="close" aria-label="Fechar">×</button></div>
  <input id="pq" class="search" type="search" placeholder="Procurar receita" value="${esc(sheet.q||"")}" autocomplete="off">
  <div class="opt" style="margin-top:10px">${chip(sheet.all?"A mostrar todas":"Mostrar todas as receitas",sheet.all,"pickall","","alt")}</div>
  <div id="plist">${pickList()}</div>`;
}
function sExport(){
  return `<div class="shead"><h2>${esc(sheet.title)}</h2><button class="close" data-a="close" aria-label="Fechar">×</button></div>
  <textarea id="exptext" class="txt" readonly style="min-height:320px">${esc(sheet.text)}</textarea>
  <div class="acts" style="margin-top:0"><button class="btn" data-a="copysheet">Copiar texto</button><button class="btn ghost" data-a="sharesheet">Partilhar</button></div>`;
}
function renderSheet(){
  const w=$("#sheetwrap");
  if(!sheet){w.classList.remove("show");w.innerHTML="";document.body.style.overflow="";return}
  let inner="";
  if(sheet.type==="detail")inner=sDetail(BY[sheet.id]);
  else if(sheet.type==="add")inner=sAdd();
  else if(sheet.type==="pick")inner=sPick();
  else if(sheet.type==="export")inner=sExport();else if(sheet.type==="weekexp")inner=sWeekExp();
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  w.classList.add("show");document.body.style.overflow="hidden";
}

function sWeekExp(){return `<div class='shead'><h2>Exportar calendário</h2><button class='close' data-a='close' aria-label='Fechar'>×</button></div><div id='cvwrap'><div class='empty'>A preparar a imagem…</div></div><div class='acts'>${DL?`<button class='btn' data-a='dlpng'>Guardar imagem (PNG)</button><button class='btn' data-a='dlpdf'>Guardar PDF</button>`:``}<button class='btn ghost' data-a='weektext'>Ver como texto</button></div>${DL?``:`<p class='note'>Guardar ficheiros não está disponível neste ecrã. Pode fazer uma captura de ecrã da imagem ou usar o texto.</p>`}`}
/* ============ RENDER GERAL ============ */
function renderTabs(){
  const p=pending();
  const t=[["recipes","📖","Receitas"],["week","📅","Semana"],["shop","🛒","Compras"]];
  $("#tabs").innerHTML=t.map(([k,i,l])=>`<button class="tab ${view===k?"on":""}" data-a="tab" data-v="${k}"><span class="ic">${i}</span>${l}${k==="shop"&&p?`<span class="badge">${p}</span>`:""}</button>`).join("");
  $("#famlabel").textContent=pessoas();
}
function render(){
  $("#app").innerHTML=view==="recipes"?vRecipes():view==="week"?vWeek():vShop();
  renderTabs();
  if(view==="recipes")renderList();
}
function todayName(){const d=new Date().getDay();return DAYS[d===0?6:d-1]}

/* ============ SUGERIR SEMANA ============ */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function suggest(){
  const used=new Set(Object.values(S.plan).flat());
  const pool=(f)=>shuffle(RECIPES.filter(f));
  const pools={bf:pool(x=>x.cat==="Pequeno-almoço"),soup:pool(x=>x.cat==="Sopa"),main:pool(x=>["Carne","Peixe","Vegetariano","Massa e arroz"].includes(x.cat)),des:pool(x=>x.cat==="Sobremesa")};
  const take=(k)=>{const p=pools[k];const f=p.find(x=>!used.has(x.id))||p[0];used.add(f.id);return f.id};
  let filled=0;
  const put=(d,s,k)=>{if(!slotItems(d,s).length){S.plan[pk(d,s)]=[take(k)];filled++}};
  DAYS.forEach((d,i)=>{
    put(d,"Pequeno-almoço","bf");
    put(d,"Almoço","main");
    put(d,"Jantar",i%2===0?"soup":"main");
  });
  ["Sábado","Domingo"].forEach(d=>{const ids=slotItems(d,"Almoço");if(ids.length===1&&BY[ids[0]].cat!=="Sobremesa"){S.plan[pk(d,"Almoço")].push(take("des"))}});
  save();render();toast(filled?"Semana sugerida":"Todos os espaços já estão preenchidos");
}

/* ============ AÇÕES ============ */
function act(a,el,e){
  const id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case "overlay": if(e.target===el){sheet=null;renderSheet()} break;
    case "close": sheet=null;renderSheet();break;
    case "tab": view=v;sheet=null;clearArm=false;renderSheet();render();window.scrollTo(0,0);break;
    case "fam": S.family=Math.min(12,Math.max(1,S.family+Number(el.dataset.d)));save();render();if(sheet)renderSheet();break;
    case "cat": F.cat=v;render();break;
    case `aut`: F.aut=v;render();break;
    
    case "flag": F.flags[v]=!F.flags[v];render();break;
    case "fav": {e.stopPropagation();const i=S.favs.indexOf(id);if(i>=0)S.favs.splice(i,1);else S.favs.push(id);save();if(view==="recipes")renderList();if(sheet&&sheet.type==="detail")renderSheet();break}
    case "open": sheet={type:"detail",id};renderSheet();break;
    case "addsheet": {const rc=BY[id];sheet={type:"add",id,day:todayName(),slot:rc.cat==="Pequeno-almoço"?"Pequeno-almoço":"Almoço"};renderSheet();break}
    case "setday": sheet.day=v;renderSheet();break;
    case "setslot": sheet.slot=v;renderSheet();break;
    case "confirmadd": {const k=pk(sheet.day,sheet.slot);(S.plan[k]=S.plan[k]||[]).push(sheet.id);save();toast("Adicionado a "+sheet.day+" ("+sheet.slot.toLowerCase()+")");sheet=null;renderSheet();render();break}
    case "pick": sheet={type:"pick",day:el.dataset.d,slot:el.dataset.s,q:"",all:false};renderSheet();break;
    case "pickall": sheet.all=!sheet.all;renderSheet();break;
    case "pickadd": {const k=pk(sheet.day,sheet.slot);(S.plan[k]=S.plan[k]||[]).push(id);save();toast("Adicionado");sheet=null;renderSheet();render();break}
    case "rm": {const k=pk(el.dataset.d,el.dataset.s);S.plan[k].splice(Number(el.dataset.i),1);save();render();break}
    case "suggest": suggest();break;
    case "clear":
      if(!clearArm){clearArm=true;render();clearTimeout(act.t);act.t=setTimeout(()=>{clearArm=false;if(view==="week")render()},3000)}
      else{S.plan={};S.checked={};clearArm=false;save();render();toast("Semana limpa")}
      break;
    case "chk": S.checked[el.dataset.k]=!S.checked[el.dataset.k];save();render();break;
    case "chkx": {const x=S.extras[Number(el.dataset.i)];x.done=!x.done;save();render();break}
    case "rmx": S.extras.splice(Number(el.dataset.i),1);save();render();break;
    case "addx": {const inp=$("#xin");const t=inp.value.trim();if(t){S.extras.push({t,done:false});save();render();$("#xin").focus()}break}
    case "uncheck": S.checked={};S.extras.forEach(x=>x.done=false);save();render();break;
    case "opt": opt[v]=!opt[v];render();break;
    case "copyshop": copyText(shopText(opt));break;
    case "shareshop": shareText("Lista de compras",shopText(opt));break;
    case "exprecipe": {const rc=BY[id];sheet={type:"export",title:rc.n,text:recipeText(rc)};renderSheet();break}
    case "copysheet": copyText(sheet.text);break;
    case `weekexp`: if(!Object.values(S.plan).some(a=>a.length)){toast(`Adicione primeiro receitas à semana`);break}sheet={type:`weekexp`};renderSheet();buildPreview();break;
    case `dlpng`: saveWeek(`png`);break;
    case `dlpdf`: saveWeek(`pdf`);break;
    case `shoppdf`: saveShop(`pdf`);break;
    case `shoppng`: saveShop(`png`);break;
    case `weektext`: sheet={type:`export`,title:`Plano da semana`,text:planText()};renderSheet();break;
    case "sharesheet": shareText(sheet.title,sheet.text);break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el)act(el.dataset.a,el,e)});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="xin"){act("addx",e.target,e)}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("card")){e.preventDefault();act("open",e.target,e)}
  if(e.key==="Escape"&&sheet){sheet=null;renderSheet()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){F.q=e.target.value;renderList()}
  if(e.target.id==="pq"){sheet.q=e.target.value;$("#plist").innerHTML=pickList()}
});
render();
</script>
